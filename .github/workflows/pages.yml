name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Stamp version into the page
        run: |
          stamp="${GITHUB_SHA::7} · $(date -u +%d.%m.%Y)"
          sed -i "s|__VERSION__|${stamp}|g" dist/index.html dist/rig.html dist/sw.js
          grep -q "data-version=\"${stamp}\"" dist/index.html

      - name: Check static application
        run: |
          node --check dist/app.js
          node --check dist/monster-motion.js
          node --check dist/rig.js
          node --check dist/sounds.js
          node --check dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/assets/icon-512.png
          node --check dist/rig-app.js
          test -s dist/assets/rig.json
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/assets/momo.png
          test -s dist/assets/pip.png
          test -s dist/assets/motion.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
