<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#73066d">
  <meta name="description" content="Lerne Momo und Pip kennen. Wähle dein Monster und bring es zum Hüpfen, Kichern und Tanzen.">
  <title>Monsterfreunde — Momo & Pip</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=3">
  <script src="monster-motion.js?v=3" defer></script>
  <script src="app.js?v=3" defer></script>
</head>
<body data-monster="momo">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="app">
    <header>
      <p class="eyebrow"><span aria-hidden="true">✳</span> MONSTERFREUNDE</p>
      <h1>Wähle dein Monster.</h1>
    </header>

    <section class="playground" aria-label="Dein Monster">
      <span class="orbit orbit-one" aria-hidden="true"></span>
      <span class="orbit orbit-two" aria-hidden="true"></span>
      <button class="arrow arrow-left" type="button" aria-label="Pip auswählen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <div class="monster-area">
        <div class="speech" id="speech" role="status" aria-live="polite"></div>
        <span class="ground" aria-hidden="true"></span>
        <button class="monster-touch" type="button" aria-label="Momo kitzeln" aria-describedby="touch-hint" disabled>
          <span class="entrance"><span class="character"><span class="sprite main-sprite" role="img" aria-label="Momo, ein freundliches blaues Wuschelmonster"></span></span></span>
        </button>
        <div class="particles" aria-hidden="true"></div>
      </div>
      <button class="arrow arrow-right" type="button" aria-label="Pip auswählen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
      </button>
    </section>

    <section class="identity" aria-label="Monstername">
      <div class="name-line"><h2 id="monster-name">Momo</h2><span class="personality" id="personality">Der Wuschel</span></div>
      <p id="touch-hint">Tippe mich an. Ich bin kitzelig!</p>
    </section>

    <div class="actions" aria-label="Mit deinem Monster spielen">
      <button type="button" class="action" data-action="tickle" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/><path d="M20 2v4M18 4h4"/></svg>
        Kitzeln
      </button>
      <button type="button" class="action" data-action="jump" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M5 17c-2 1-2 3 0 4s12 1 14 0 2-3 0-4"/></svg>
        Hüpfen
      </button>
      <button type="button" class="action" data-action="dance" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13M9 9l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/></svg>
        Tanzen
      </button>
    </div>

    <footer class="selection">
      <div class="monster-choices" role="radiogroup" aria-label="Monster auswählen">
        <button class="choice selected" type="button" role="radio" aria-checked="true" data-choice="momo" tabindex="0" aria-label="Momo, blauer Wuschel">
          <span class="portrait"><span class="sprite mini-sprite momo" aria-hidden="true"></span><span class="check" aria-hidden="true">✓</span></span>
          <span class="choice-name">Momo</span>
        </button>
        <button class="choice" type="button" role="radio" aria-checked="false" data-choice="pip" tabindex="-1" aria-label="Pip, orangefarbener Wirbelwind">
          <span class="portrait"><span class="sprite mini-sprite pip" aria-hidden="true"></span><span class="check" aria-hidden="true">✓</span></span>
          <span class="choice-name">Pip</span>
        </button>
      </div>
      <p class="selection-hint">Zwei kleine Monster. Jede Menge Quatsch.</p>
    </footer>
    <p class="load-error" role="alert" hidden>Die Monster konnten gerade nicht laden. <button type="button" id="reload">Nochmal versuchen</button></p>
  </main>
</body>
</html>
