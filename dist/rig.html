<!doctype html>
<html lang="de" data-version="__VERSION__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#73066d">
  <meta name="robots" content="noindex">
  <title>Monsterfreunde — Rig-Prototyp</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=__VERSION__">
  <style>
    .rig{position:absolute;inset:0;pointer-events:none}
    .part{position:absolute;display:block;pointer-events:none;will-change:transform}
    .part img{display:block;width:100%;height:100%}
    .eye-white{position:absolute;inset:0;width:100%;height:100%}
    .pupil{position:absolute;left:50%;top:50%;width:52%;height:52%;margin:-26% 0 0 -26%;border-radius:50%;transition:opacity .05s}
    .lid{position:absolute;inset:-2%;border-radius:50%;background:var(--skin);transform-origin:50% 0;transform:scaleY(0)}
    .lid.lower{transform-origin:50% 100%}
    .note{font-size:12px;color:#fff9ff8c;text-align:center;margin:0 0 10px;line-height:1.5}
    .note a{color:var(--accent)}
  </style>
  <script src="monster-motion.js?v=__VERSION__" defer></script>
  <script src="rig.js?v=__VERSION__" defer></script>
  <script src="rig-app.js?v=__VERSION__" defer></script>
</head>
<body data-monster="momo">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="app">
    <header>
      <p class="eyebrow"><span aria-hidden="true">✳</span> RIG-PROTOTYP</p>
      <h1>Teile statt Posen.</h1>
    </header>

    <section class="playground" aria-label="Dein Monster">
      <button class="arrow arrow-left" type="button" aria-label="Voriges Monster">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <div class="monster-area">
        <div class="speech" id="speech" role="status" aria-live="polite"></div>
        <span class="ground" aria-hidden="true"></span>
        <button class="monster-touch" type="button" aria-label="Monster kitzeln" disabled>
          <span class="entrance"><span class="character"><span class="sprite main-sprite rendered" role="img" aria-label="Dein Monster"><span class="rig" id="rig"></span></span></span></span>
        </button>
        <div class="particles" aria-hidden="true"></div>
      </div>
      <button class="arrow arrow-right" type="button" aria-label="Nächstes Monster">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
      </button>
    </section>

    <section class="identity" aria-label="Monstername">
      <div class="name-line"><h2 id="monster-name">Momo</h2><span class="personality" id="personality">Der Wuschel</span></div>
      <p id="touch-hint">Tippe mich an. Ich bin kitzelig!</p>
    </section>

    <div class="actions" aria-label="Mit deinem Monster spielen">
      <button type="button" class="action" data-action="tickle" disabled>Kitzeln</button>
      <button type="button" class="action" data-action="jump" disabled>Hüpfen</button>
      <button type="button" class="action" data-action="dance" disabled>Tanzen</button>
      <button type="button" class="action" data-action="wave" disabled>Winken</button>
    </div>

    <footer class="selection">
      <p class="note">Prototyp aus Teilen der vorhandenen Zeichnungen, siehe ANIMATION.md. <a href="./">Zur Hauptseite</a></p>
    </footer>
    <p class="version" aria-label="Version der App">Version <span id="version">lokal</span></p>
  </main>
</body>
</html>
